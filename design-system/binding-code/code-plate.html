<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暖芽设计系统 · 绑定码牌子</title>
<style>
/* ↓↓↓ 以下是 h5/src/styles.css 的原文，由 scripts/build-design-system.mjs 内联 ↓↓↓ */
/**
 * 设计令牌与基础样式。
 * 刻意不引外部字体：小程序包体装不下中文字体子集，
 * design.md §4.4 也写明"包体不允许则降级为平台默认中文字体"，
 * 这里保持一致，两端观感统一。
 */

:root {
  /* 主色 —— 深绿，取自原型 */
  --c-primary: #2f5b45;
  --c-primary-soft: #e7efdf;
  --c-primary-ink: #1e3c2d;
  /* 强调 —— 陶土红 / 暖黄 */
  --c-accent: #d86f45;
  --c-gold: #e8b44a;
  /* 背景层次 */
  --c-bg: #efe9dc;
  --c-surface: #fffaf0;
  --c-surface-2: #f7f0df;
  --c-line: #e3d8c2;
  /* 文字 */
  --c-ink: #27332d;
  --c-ink-2: #6b7a6f;
  --c-ink-3: #9aa79d;
  /* 语义色 */
  --c-danger: #c0442f;
  --c-success: #3d7a52;
  --c-warn: #b8801f;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;

  --tabbar-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
    "Source Han Sans SC", sans-serif;
  color: var(--c-ink);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--c-bg);
  overscroll-behavior-y: none;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px 12px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(47, 91, 69, 0.1);
}

textarea {
  min-height: 84px;
  resize: vertical;
}

/* --------------------------------- 外壳 --------------------------------- */

#app {
  height: 100%;
}

.shell {
  display: flex;
  flex-direction: column;
  width: min(480px, 100%);
  height: 100%;
  margin: 0 auto;
  background: var(--c-bg);
  box-shadow: 0 0 48px rgba(39, 51, 45, 0.12);
  overflow: hidden;
}

.navbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: var(--c-primary);
  color: #fdf8ec;
}

.navbar__back {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-left: -6px;
  border-radius: 50%;
  color: #fdf8ec;
}

.navbar__back:active {
  background: rgba(255, 255, 255, 0.15);
}

.navbar__title {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.navbar__extra {
  flex: 0 0 auto;
  font-size: 12px;
  color: #d8e6d5;
}

.page {
  flex: 1 1 auto;
  min-height: 0;
  padding: 14px 14px calc(18px + var(--safe-b));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.shell--tabbed .page {
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 18px);
}

/* -------------------------------- TabBar -------------------------------- */

.tabbar {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  width: min(480px, 100%);
  margin: 0 auto;
  padding-bottom: var(--safe-b);
  background: var(--c-surface);
  border-top: 1px solid var(--c-line);
}

.tabbar__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: var(--tabbar-h);
  color: var(--c-ink-3);
  font-size: 11px;
}

.tabbar__item.is-active {
  color: var(--c-primary);
  font-weight: 700;
}

.tabbar__icon {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tabbar__badge {
  position: absolute;
  transform: translate(14px, -10px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  color: #fff;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  background: var(--c-accent);
  border-radius: 8px;
}

/* --------------------------------- 卡片 --------------------------------- */

.card {
  padding: 14px;
  margin-bottom: 12px;
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: var(--r-lg);
}

.card--flat {
  background: var(--c-surface-2);
}

.card__title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 700;
}

.card__hint {
  margin: 0;
  color: var(--c-ink-2);
  font-size: 12px;
  line-height: 1.7;
}

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 18px 2px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-ink-2);
  letter-spacing: 0.06em;
}

.empty {
  padding: 28px 16px;
  color: var(--c-ink-3);
  font-size: 13px;
  text-align: center;
}

/* --------------------------------- 按钮 --------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--c-primary);
  background: var(--c-primary-soft);
  border-radius: var(--r-md);
}

.btn:active {
  transform: scale(0.98);
}

.btn--primary {
  color: #fdf8ec;
  background: var(--c-primary);
}

.btn--accent {
  color: #fff;
  background: var(--c-accent);
}

.btn--ghost {
  color: var(--c-ink-2);
  background: transparent;
  border: 1px solid var(--c-line);
}

.btn--danger {
  color: #fff;
  background: var(--c-danger);
}

.btn--block {
  width: 100%;
}

.btn--sm {
  min-height: 30px;
  padding: 0 10px;
  font-size: 12px;
  border-radius: 10px;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* --------------------------------- 标签 --------------------------------- */

.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 999px;
  background: var(--c-primary-soft);
  color: var(--c-primary);
  white-space: nowrap;
}

.tag--gold {
  background: #fbf0d5;
  color: var(--c-warn);
}

.tag--accent {
  background: #fae2d8;
  color: var(--c-accent);
}

.tag--muted {
  background: #ebe6da;
  color: var(--c-ink-2);
}

.tag--danger {
  background: #f7dcd7;
  color: var(--c-danger);
}

/* --------------------------------- 列表 --------------------------------- */

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--c-line);
}

.row:last-child {
  border-bottom: 0;
}

.row__main {
  flex: 1;
  min-width: 0;
}

.row__title {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row__sub {
  margin-top: 3px;
  color: var(--c-ink-2);
  font-size: 12px;
  line-height: 1.6;
}

.row__value {
  flex: 0 0 auto;
  font-size: 15px;
  font-weight: 700;
  text-align: right;
}

.avatar {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  color: #fdf8ec;
  font-size: 15px;
  font-weight: 700;
  background: var(--c-primary);
  border-radius: 50% 50% 50% 10px;
}

.avatar--accent {
  background: var(--c-accent);
}

/* --------------------------------- 网格 --------------------------------- */

.grid {
  display: grid;
  gap: 8px;
}

.grid--2 {
  grid-template-columns: repeat(2, 1fr);
}

.grid--3 {
  grid-template-columns: repeat(3, 1fr);
}

.metric {
  padding: 12px 10px;
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: var(--r-md);
}

.metric strong {
  display: block;
  font-size: 24px;
  line-height: 1.1;
  color: var(--c-primary);
}

.metric span {
  display: block;
  margin-top: 5px;
  color: var(--c-ink-2);
  font-size: 11px;
}

.metric.is-alert strong {
  color: var(--c-accent);
}

/* --------------------------------- 表单 --------------------------------- */

.field {
  margin-bottom: 12px;
}

.field__label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
}

.field__hint {
  margin: 6px 0 0;
  color: var(--c-ink-2);
  font-size: 12px;
  line-height: 1.6;
}

.field__error {
  margin: 6px 0 0;
  color: var(--c-danger);
  font-size: 12px;
  font-weight: 600;
}

/* ------------------------------- 绑定码输入 ------------------------------- */

.code-input {
  width: 100%;
  padding: 14px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-align: center;
  text-transform: uppercase;
  background: #fff;
  border: 2px solid var(--c-line);
  border-radius: var(--r-md);
}

.code-input::placeholder {
  color: #cfc7b6;
  letter-spacing: 0.18em;
}

.code-input.is-valid {
  border-color: var(--c-primary);
  background: #f6fbf4;
}

.code-input.is-invalid {
  border-color: var(--c-danger);
  background: #fff6f4;
}

.code-preview {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--c-primary-soft);
  border-radius: var(--r-md);
  font-size: 13px;
}

/* 管理端展示学生绑定码的牌子 */
.code-plate {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  background: linear-gradient(135deg, #2f5b45, #3d7358);
  color: #fdf8ec;
  border-radius: var(--r-md);
}

.code-plate__code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.code-plate__label {
  font-size: 11px;
  opacity: 0.8;
}

.code-plate.is-disabled {
  background: #8d9a90;
}

/* --------------------------------- 登录 --------------------------------- */

.login {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: 0 20px calc(24px + var(--safe-b));
  background: linear-gradient(180deg, #2f5b45 0%, #2f5b45 190px, var(--c-bg) 190px);
}

.login__brand {
  padding: calc(env(safe-area-inset-top, 0px) + 34px) 0 26px;
  color: #fdf8ec;
}

.login__mark {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-bottom: 14px;
  font-size: 26px;
  font-weight: 700;
  color: #2f5b45;
  background: var(--c-gold);
  border-radius: 16px 16px 16px 5px;
  transform: rotate(-4deg);
}

.login__brand h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 0.08em;
}

.login__brand p {
  margin: 6px 0 0;
  font-size: 13px;
  color: #cfe0cb;
}

.login__card {
  padding: 18px 16px 20px;
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: var(--r-lg);
  box-shadow: 0 12px 30px rgba(39, 51, 45, 0.1);
}

.login__switch {
  display: flex;
  gap: 4px;
  margin-top: 16px;
  padding: 4px;
  background: var(--c-surface-2);
  border-radius: var(--r-md);
}

.login__switch button {
  flex: 1;
  padding: 9px 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-2);
  border-radius: 10px;
}

.login__switch button.is-active {
  color: var(--c-primary);
  background: var(--c-surface);
  box-shadow: 0 1px 4px rgba(39, 51, 45, 0.1);
}

/* ------------------------------ 弹层 / 提示 ------------------------------ */

.mask {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(30, 38, 32, 0.45);
  animation: fade 0.16s ease;
}

.mask--center {
  align-items: center;
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

.sheet {
  width: min(480px, 100%);
  max-height: 86vh;
  padding: 18px 16px calc(18px + var(--safe-b));
  overflow-y: auto;
  background: var(--c-surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  animation: rise 0.2s ease;
}

@keyframes rise {
  from {
    transform: translateY(18px);
  }
}

.sheet__title {
  margin: 0 0 12px;
  font-size: 17px;
  font-weight: 700;
}

.dialog {
  width: min(320px, 86%);
  padding: 20px 18px 14px;
  background: var(--c-surface);
  border-radius: var(--r-lg);
  text-align: center;
}

.dialog__title {
  margin: 0 0 8px;
  font-size: 16px;
  font-weight: 700;
}

.dialog__body {
  margin: 0 0 16px;
  color: var(--c-ink-2);
  font-size: 13px;
  line-height: 1.7;
}

.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 90;
  max-width: 74%;
  padding: 12px 18px;
  color: #fff8ea;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
  background: rgba(35, 45, 38, 0.92);
  border-radius: var(--r-md);
  transform: translate(-50%, -50%);
  animation: fade 0.16s ease;
  pointer-events: none;
}

.toast--error {
  background: rgba(150, 45, 30, 0.94);
}

.loading {
  padding: 40px 0;
  color: var(--c-ink-3);
  font-size: 13px;
  text-align: center;
}

/* --------------------------------- 杂项 --------------------------------- */

.hero {
  padding: 16px;
  margin-bottom: 12px;
  color: #fdf8ec;
  background: linear-gradient(135deg, #2f5b45, #3f7359);
  border-radius: var(--r-lg);
}

.hero__label {
  margin: 0;
  font-size: 12px;
  opacity: 0.85;
}

.hero__value {
  display: block;
  margin-top: 4px;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
}

.hero__foot {
  display: flex;
  gap: 14px;
  margin-top: 12px;
  font-size: 12px;
  opacity: 0.9;
}

.picker {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin-bottom: 12px;
  scrollbar-width: none;
}

.picker::-webkit-scrollbar {
  display: none;
}

.picker button {
  flex: 0 0 auto;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-2);
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: 999px;
}

.picker button.is-active {
  color: #fdf8ec;
  background: var(--c-primary);
  border-color: var(--c-primary);
}

.rank {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--c-line);
}

.rank:last-child {
  border-bottom: 0;
}

.rank__no {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-ink-2);
  background: var(--c-surface-2);
  border-radius: 9px;
}

.rank--top1 .rank__no {
  color: #7a5a12;
  background: var(--c-gold);
}

.rank--top2 .rank__no,
.rank--top3 .rank__no {
  color: #fff;
  background: #b6a88c;
}

.rank.is-self {
  background: #f4f9f1;
  border-radius: 10px;
  padding-left: 8px;
  padding-right: 8px;
}

.ledger__delta {
  font-size: 16px;
  font-weight: 700;
}

.ledger__delta.is-plus {
  color: var(--c-success);
}

.ledger__delta.is-minus {
  color: var(--c-accent);
}

.is-reversed {
  color: var(--c-ink-3);
  text-decoration: line-through;
}

.thumb {
  width: 100%;
  max-height: 180px;
  margin-top: 8px;
  object-fit: cover;
  border-radius: var(--r-md);
}

.thumb--sm {
  width: 56px;
  height: 56px;
  margin: 0;
}

.divider {
  height: 1px;
  margin: 12px 0;
  background: var(--c-line);
}

.text-muted {
  color: var(--c-ink-2);
}

.text-small {
  font-size: 12px;
}

.stack {
  display: grid;
  gap: 8px;
}

.inline {
  display: flex;
  align-items: center;
  gap: 8px;
}

.spread {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.08em;
}

.switch {
  position: relative;
  flex: 0 0 auto;
  width: 44px;
  height: 26px;
  background: #cfc7b6;
  border-radius: 999px;
  transition: background 0.16s;
}

.switch.is-on {
  background: var(--c-primary);
}

.switch::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  content: "";
  background: #fff;
  border-radius: 50%;
  transition: transform 0.16s;
}

.switch.is-on::after {
  transform: translateX(18px);
}

/* ↑↑↑ 原文结束。下面是仅用于本预览页的排版样式 ↑↑↑ */
body{margin:0;padding:18px 14px 26px;background:var(--c-bg);}
       .ds-section{margin:0 0 22px;}
       .ds-section:last-child{margin-bottom:0;}
       .ds-label{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--c-ink-3);}
       .ds-note{margin:6px 0 0;font-size:11px;line-height:1.7;color:var(--c-ink-2);}
       .ds-swatch{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--c-line);}
       .ds-swatch:last-child{border-bottom:0;}
       .ds-chip{width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid rgba(0,0,0,.08);}
       .ds-swatch code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--c-ink-2);}
       .ds-swatch b{display:block;font-size:13px;}
       .ds-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
</style>
</head>
<body>
<div class="ds-section"><p class="ds-label">学员卡片上的牌子</p><div class="card">
        <div class="card__title"><div>张小满（小满）</div><span class="tag">三年级</span></div>
        <div class="code-plate">
          <div><div class="code-plate__label">绑定码</div><div class="code-plate__code">K3M9-QX2T</div></div>
          <button class="btn btn--sm">复制</button>
        </div>
        <div class="spread" style="margin-top:10px"><span class="text-small text-muted">128 分</span><button class="btn btn--sm">详情</button></div>
      </div></div><div class="ds-section"><p class="ds-label">停用态</p><div class="card">
        <div class="code-plate is-disabled">
          <div><div class="code-plate__label">绑定码已停用</div><div class="code-plate__code">K3M9-QX2T</div></div>
          <button class="btn btn--sm">复制</button>
        </div>
